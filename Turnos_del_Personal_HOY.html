<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0a">
  <title>Turnos por Unidad de Negocio</title>
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Turnos">
  <meta name="application-name" content="Turnos">
  <meta name="description" content="Calendario unificado de turnos por unidad de negocio">
  <link id="manifestLink" rel="manifest">
  <link id="appleIcon" rel="apple-touch-icon">
  <style>
    :root{
      --pink:#f472b6; --purple:#a78bfa; --blue:#60a5fa; --navy:#e2e8f0;
      --grad: linear-gradient(135deg, #DD2FB5 0%, #7A29E6 50%, #2632F0 100%);
      --bg:#0a0a0a; --card:#141414; --tx:#f1f5f9; --tx2:#94a3b8; --bd:#262626;
      --card2:#1a1a1a; --hover:#1f1f1f;
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;padding:0}
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
      background:var(--bg); color:var(--tx); -webkit-font-smoothing:antialiased; overscroll-behavior-y:contain;
      min-height:100dvh}
    .topbar{position:sticky; top:0; z-index:20; background:rgba(10,10,10,.92);
      -webkit-backdrop-filter:blur(16px); backdrop-filter:blur(16px);
      border-bottom:1px solid var(--bd); padding-top:env(safe-area-inset-top)}
    .bar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px 0}
    .brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
    .logo-s{width:40px;height:40px;flex:0 0 auto;display:block}
    .brand-info{display:flex;flex-direction:column;min-width:0;flex:1}
    .brand-name{font-weight:800;font-size:14px;letter-spacing:-.01em;line-height:1.15;
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--tx)}
    .brand-clock{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--tx2);
      font-weight:600;margin-top:1px;white-space:nowrap;overflow:hidden}
    .reloj{font-variant-numeric:tabular-nums;color:#60a5fa;font-weight:800;letter-spacing:.02em}
    .sep-clock{color:#404040}
    .bar-actions{display:flex;align-items:center;gap:6px;flex:0 0 auto}
    .hoy{border:1px solid var(--bd);background:var(--card);color:var(--tx);
      font:inherit;font-size:13px;font-weight:700;padding:6px 14px;border-radius:999px;cursor:pointer}
    .hoy:active{background:var(--hover)}
    .btn-edit{border:1px solid var(--purple); background:var(--card); color:var(--purple);
      font:inherit; font-size:13px; font-weight:800;
      padding:6px 14px; border-radius:999px; cursor:pointer;
      transition: background .15s, color .15s, border-color .15s}
    .btn-edit:hover{background:#1e1030}
    .btn-edit.active{background:var(--pink); color:#0a0a0a; border-color:var(--pink)}
    .btn-theme{border:1px solid var(--bd);background:var(--card);color:var(--tx);
      font:inherit;font-size:13px;font-weight:800;padding:6px 12px;border-radius:999px;cursor:pointer;
      transition:background .15s,color .15s,border-color .15s}
    .btn-theme:hover{background:var(--hover)}
    .nav{display:flex;align-items:center;gap:2px;padding:4px 8px 0}
    .arrow{width:44px;height:44px;flex:0 0 auto;border:0;background:transparent;
      font-size:28px;line-height:1;color:#64748b;border-radius:12px;cursor:pointer;
      display:grid;place-items:center;padding:0 0 3px}
    .arrow:active{background:var(--hover);color:var(--tx)}
    .titulo{flex:1;text-align:center;font-size:16px;font-weight:800;letter-spacing:-.01em;
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--tx)}
    .tabs{display:flex;gap:4px;margin:8px 12px 8px;background:#1a1a1a;padding:4px;border-radius:14px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
    .tabs::-webkit-scrollbar{display:none}
    .tab{flex:0 0 auto;min-width:52px;border:0;background:transparent;font:inherit;font-size:12.5px;font-weight:700;
      color:#64748b;padding:9px 12px;border-radius:10px;cursor:pointer;transition:background .15s,color .15s}
    .tab.activo{background:var(--grad);color:#fff;box-shadow:0 2px 8px rgba(122,41,230,.35)}
    .chips-wrap{display:flex;flex-direction:column;gap:6px;padding-bottom:10px}
    .chips{display:flex;gap:8px;overflow-x:auto;padding:0 14px;scrollbar-width:none}
    .chips::-webkit-scrollbar{display:none}
    .chips:empty{display:none}
    .chip{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;
      border:1px solid var(--bd);background:var(--card);color:var(--tx2);
      font:inherit;font-size:13px;font-weight:700;
      padding:7px 14px;border-radius:999px;cursor:pointer;white-space:nowrap}
    .chip i{width:8px;height:8px;border-radius:50%;background:var(--c,#94a3b8);display:block}
    .chip.on{background:var(--c,#2632F0);border-color:var(--c,#2632F0);color:#fff}
    .chip.on i{background:rgba(255,255,255,.9)}
    main{padding:12px;display:flex;flex-direction:column;gap:12px;
      max-width:720px;margin:0 auto;width:100%;
      padding-bottom:calc(32px + env(safe-area-inset-bottom))}
    main.wide{max-width:100%;padding:8px 4px;
      padding-bottom:calc(32px + env(safe-area-inset-bottom));gap:10px}
    main.wide .tabla-wrap{border-radius:10px}
    main.wide .nq-wrap{border-radius:10px}
    .fecha-grande{font-size:20px;font-weight:800;letter-spacing:-.02em;text-transform:capitalize;color:var(--tx)}
    .sub{font-size:13px;color:var(--tx2);margin-top:3px;font-weight:600}
    .unidad-bloque{background:var(--card);border-radius:16px;border:1px solid var(--bd);
      overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.3)}
    .unidad-head{display:flex;align-items:center;justify-content:space-between;
      padding:12px 14px;background:var(--card2);border-bottom:1px solid var(--bd);
      border-left:4px solid var(--uc)}
    .unidad-name{font-size:14px;font-weight:800;letter-spacing:-.01em}
    .unidad-count{font-size:11px;font-weight:800;color:#fff;background:var(--uc);
      padding:2px 9px;border-radius:999px}
    .lugar-head{display:flex;align-items:center;gap:6px;padding:10px 14px 4px;
      font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:#64748b}
    .lugar-head::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--uc)}
    .turno{display:flex;align-items:center;gap:12px;background:var(--card);
      padding:12px 14px;border-left:5px solid var(--c);border-bottom:1px solid var(--bd)}
    .turno:last-child{border-bottom:0}
    .avatar{width:38px;height:38px;flex:0 0 auto;border-radius:12px;
      background:var(--c);color:#fff;display:grid;place-items:center;
      font-size:13px;font-weight:800;letter-spacing:.02em}
    .cuerpo{min-width:0;flex:1}
    .fila1{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
    .nombre{font-weight:700;font-size:15px}
    .badge{font-size:10px;font-weight:800;padding:3px 8px;border-radius:999px;
      background:#262626;color:#94a3b8;text-transform:uppercase;letter-spacing:.05em}
    .fila2{font-size:13px;color:var(--tx2);margin-top:4px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
    .hora{font-variant-numeric:tabular-nums;font-weight:700;color:#cbd5e1}
    .sep{color:#404040}
    .vacio{text-align:center;padding:52px 20px;color:var(--tx2);font-size:15px;font-weight:600;
      background:var(--card);border-radius:16px;border:1px dashed var(--bd)}
    .vacio-mini{padding:12px 14px;font-size:13px;color:#94a3b8;font-weight:600}
    .bloque-dia{background:var(--card);border-radius:16px;border:1px solid var(--bd);overflow:hidden}
    .bloque-dia.hoy{border-color:#3b82f6;box-shadow:0 0 0 2px rgba(59,130,246,.35)}
    .bloque-head{display:flex;justify-content:space-between;align-items:center;
      padding:10px 14px;background:var(--card2);border-bottom:1px solid var(--bd)}
    .dname{font-weight:800;font-size:14px;text-transform:capitalize;color:var(--tx)}
    .dcount{font-size:12px;color:var(--tx2);font-weight:800}
    .bloque-dia .turno{border-left:4px solid var(--c);border-bottom:1px solid #f1f5f9;padding:9px 12px}
    .bloque-dia .turno:last-child{border-bottom:0}
    .bloque-dia .avatar{width:30px;height:30px;border-radius:9px;font-size:11px}
    .bloque-dia .nombre{font-size:13.5px}
    .bloque-dia .badge{font-size:9px;padding:2px 6px}
    .bloque-dia .fila2{font-size:11.5px;margin-top:2px}
    .mes-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;
      background:var(--card);padding:10px;border-radius:16px;border:1px solid var(--bd)}
    .dow{text-align:center;font-size:11px;font-weight:800;color:#64748b;padding:6px 0;text-transform:uppercase}
    .celda{aspect-ratio:1/1.1;border:1px solid transparent;background:#1a1a1a;border-radius:12px;
      display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
      font:inherit;cursor:pointer;padding:2px;position:relative;min-height:44px}
    .celda.vacia{background:transparent;cursor:default}
    .celda .num{font-size:13px;font-weight:700;color:#cbd5e1;line-height:1}
    .celda.hoy{background:#1e3a5f;border-color:#3b82f6}
    .celda.hoy .num{color:#93c5fd}
    .celda.sel{background:var(--grad);border-color:transparent}
    .celda.sel .num{color:#fff}
    .dots{display:flex;gap:2px;flex-wrap:wrap;justify-content:center;max-width:100%}
    .dots i{width:6px;height:6px;border-radius:50%;display:block}
    .mas{position:absolute;bottom:2px;right:4px;font-size:9px;font-weight:800;color:#94a3b8}
    .celda.sel .mas{color:#cbd5e1}
    .descanso-bloque{background:var(--card);border-radius:16px;border:1px solid #78350f;
      overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.3)}
    .descanso-head{display:flex;align-items:center;justify-content:space-between;
      padding:12px 14px;background:#1c1408;border-bottom:1px solid #78350f;
      border-left:4px solid #f59e0b}
    .descanso-title{display:flex;align-items:center;gap:7px;
      font-size:14px;font-weight:800;letter-spacing:-.01em;color:#fbbf24}
    .descanso-title .ico{font-size:15px;line-height:1}
    .descanso-count{font-size:11px;font-weight:800;color:#0a0a0a;background:#f59e0b;
      padding:2px 9px;border-radius:999px}
    .descanso-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));
      gap:8px;padding:12px 14px}
    .descanso-item{display:flex;align-items:center;gap:8px;
      background:#1c1408;border:1px solid #3d2a0a;border-radius:10px;
      padding:8px 10px;min-width:0}
    .descanso-av{width:28px;height:28px;flex:0 0 auto;border-radius:8px;
      background:var(--c);color:#fff;display:grid;place-items:center;
      font-size:10.5px;font-weight:800;letter-spacing:.02em}
    .descanso-info{min-width:0;flex:1}
    .descanso-name{font-weight:800;font-size:11.5px;line-height:1.2;color:#fde68a;
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .descanso-lugar{font-size:9.5px;color:#b45309;font-weight:700;margin-top:1px;
      text-transform:uppercase;letter-spacing:.03em;
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .mes-chips{display:flex; gap:6px; flex-wrap:wrap; padding:8px 4px 10px; margin-bottom:4px; align-items:center;
      position:sticky; top:0; z-index:5; background:var(--bg); padding-top:4px}
    .mes-chips .mes-label{font-size:10.5px; font-weight:800; text-transform:uppercase;
      letter-spacing:.08em; color:#64748b; margin-right:4px}
    .mchip{flex:0 0 auto; border:1px solid var(--bd); background:var(--card); color:var(--tx2);
      font:inherit; font-size:13px; font-weight:800;
      padding:8px 16px; border-radius:999px; cursor:pointer;
      transition: background .15s, color .15s, border-color .15s, box-shadow .15s;
      font-variant-numeric: tabular-nums; min-height:40px}
    .mchip:hover{background:var(--hover)}
    .mchip.on{color:#fff; border-color:transparent;
      box-shadow:0 2px 10px rgba(122,41,230,.4)}
    .mchip.on[data-mes=""] { background:var(--grad) }
    .mchip.on[data-mes="9"] { background:#2632F0; border-color:#2632F0 }
    .mchip.on[data-mes="10"]{ background:#7A29E6; border-color:#7A29E6 }
    .mchip.on[data-mes="11"]{ background:#DD2FB5; border-color:#DD2FB5 }
    .mchip.on[data-mes="12"]{ background:#1e293b; border-color:#334155 }
    .edit-tools{background:var(--card); border-radius:12px; border:1px solid var(--bd);
      padding:12px; margin-bottom:10px; box-shadow:0 1px 3px rgba(2,18,65,.06);
      display:flex; flex-direction:column; gap:14px}
    .edit-section{display:flex; flex-direction:column; gap:8px}
    .edit-section-title{font-size:12.5px; font-weight:800; color:var(--navy);
      padding-bottom:6px; border-bottom:1px dashed var(--bd);
      display:flex; align-items:center; gap:6px}
    .edit-section-title .hint-mini{font-size:10.5px; font-weight:600; color:#94a3b8; margin-left:auto}
    .edit-tools-row{display:flex; gap:8px; flex-wrap:wrap; align-items:center}
    .edit-input{flex:1; min-width:120px; padding:9px 11px; font:inherit; font-size:13px; font-weight:600;
      border:1px solid var(--bd); border-radius:8px; background:#1a1a1a; color:var(--tx);
      outline:none; transition:border-color .15s, box-shadow .15s}
    .edit-input:focus{border-color:var(--blue); box-shadow:0 0 0 3px rgba(38,50,240,.15)}
    .edit-date-label{display:flex; align-items:center; gap:6px;
      font-size:11.5px; font-weight:800; color:var(--tx2);
      text-transform:uppercase; letter-spacing:.04em; white-space:nowrap}
    .edit-date-label .edit-input{min-width:135px; flex:0 0 auto; text-transform:none}
    .edit-btn-apply{border:0; font:inherit; font-weight:800; font-size:13px;
      padding:10px 20px; border-radius:8px; cursor:pointer;
      background:var(--grad); color:#fff;
      box-shadow:0 2px 6px rgba(122,41,230,.25);
      transition:opacity .15s, transform .1s; white-space:nowrap}
    .edit-btn-apply:hover{opacity:.9}
    .edit-btn-apply:active{transform:translateY(1px)}
    .edit-colors{display:grid; grid-template-columns:repeat(auto-fill, minmax(210px, 1fr)); gap:6px}
    .edit-color-item{display:flex; align-items:center; gap:8px;
      padding:5px 8px; border:1px solid var(--bd); border-radius:8px;
      background:#1a1a1a; cursor:pointer;
      font-size:12px; font-weight:700; color:var(--navy);
      transition:background .15s, border-color .15s}
    .edit-color-item:hover{background:#222; border-color:#333}
    .edit-color-item input[type="color"]{width:28px; height:28px; padding:0; border:1px solid var(--bd);
      border-radius:6px; cursor:pointer; background:transparent; flex:0 0 auto}
    .edit-color-item input[type="color"]::-webkit-color-swatch-wrapper{padding:2px}
    .edit-color-item input[type="color"]::-webkit-color-swatch{border:0; border-radius:4px}
    .edit-color-item input[type="color"]::-moz-color-swatch{border:0; border-radius:4px}
    .edit-color-item span{flex:1; min-width:0;
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
    .edit-color-item .reset{border:0; background:transparent; color:#94a3b8;
      font:inherit; font-size:14px; font-weight:800;
      padding:0 3px; cursor:pointer; line-height:1; flex:0 0 auto}
    .edit-color-item .reset:hover{color:#dc2626}

    .tabla-wrap{background:var(--card);border-radius:14px;border:1px solid var(--bd);
      overflow:hidden;box-shadow:0 1px 2px rgba(2,18,65,.04);
      display:flex;flex-direction:column; margin-bottom:6px}
    .tabla-head{display:flex;align-items:center;gap:8px;
      padding:11px 14px;background:var(--card2);border-bottom:1px solid var(--bd);
      font-size:13px;font-weight:800;color:var(--tx)}
    .tabla-head::before{content:"";width:6px;height:6px;border-radius:50%;
      background:var(--tc,var(--blue));flex:0 0 auto}
    .tabla-head .tc-sub{font-size:10.5px;color:#94a3b8;font-weight:600;margin-left:auto;white-space:nowrap}
    .tabla-scroll{overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch}
    .tabla-scroll::-webkit-scrollbar{height:7px}
    .tabla-scroll::-webkit-scrollbar-track{background:#1a1a1a}
    .tabla-scroll::-webkit-scrollbar-thumb{background:#404040;border-radius:4px}

    table.shift-grid{border-collapse:separate;border-spacing:0;
      font-size:10px;font-variant-numeric:tabular-nums}

    table.shift-grid th{
      border-right:1px solid #2a2a2a;border-bottom:1px solid #2a2a2a;
      padding:6px 4px;text-align:center;
      min-width:58px;max-width:58px;
      white-space:nowrap;
      font-weight:800;line-height:1.2;
    }
    table.shift-grid td{
      border-right:1px solid #2a2a2a;border-bottom:1px solid #2a2a2a;
      padding:7px 3px;text-align:center;
      min-width:58px;max-width:58px;
      font-weight:700;line-height:1.15;
      white-space:normal;
      word-break:break-word;
      hyphens:auto;
      font-size:9.5px;
      vertical-align:middle;
      color:#e2e8f0;
    }
    table.shift-grid thead th{position:sticky;top:0;z-index:3;
      background:#1e1e1e;color:#94a3b8;
      font-weight:800;font-size:10px;letter-spacing:.01em}
    table.shift-grid thead th.month-start{border-left:3px solid #60a5fa; background:#252525}
    table.shift-grid tbody tr:last-child td{border-bottom:0}
    table.shift-grid td:last-child{border-right:0}
    table.shift-grid th:last-child{border-right:0}
    table.shift-grid .sticky-col{
      position:sticky;left:0;z-index:2;
      background:#141414;text-align:left;
      min-width:100px;max-width:100px;
      border-right:2px solid #333;
      font-weight:800;white-space:normal;line-height:1.25;
      padding:8px 8px;
      font-size:10px;
      color:#f1f5f9;
    }
    table.shift-grid thead .sticky-col{z-index:4;background:#1e1e1e;font-size:10px;color:#94a3b8}
    table.shift-grid .sticky-col .sc-sub{display:block;font-weight:600;color:#64748b;font-size:9px;margin-top:2px}
    table.shift-grid td.cell-v{color:#e2e8f0}
    table.shift-grid td.cell-empty{color:#404040;background:#111}

    body.edit-mode table.shift-grid td[contenteditable="true"]{
      background:#1a1a2e !important; color:#f1f5f9 !important;
      outline:2px dashed var(--pink); outline-offset:-2px;
      cursor:text; font-weight:700}
    body.edit-mode table.shift-grid td[contenteditable="true"]:focus{
      outline:2px solid var(--blue); background:#1e3a5f !important}
    body.edit-mode .tabla-head{background:linear-gradient(90deg,#1a1020,#14101a)}
    body.edit-mode .tabla-head::after{
      content:"✏️ Editando nombres";
      margin-left:auto; font-size:10.5px; font-weight:800; color:var(--pink)}

    .nq-wrap{background:var(--card);border-radius:16px;border:1px solid var(--bd);
      overflow:hidden;box-shadow:0 1px 2px rgba(2,18,65,.04)}
    .nq-head{display:flex;align-items:center;gap:8px;
      padding:12px 14px;background:linear-gradient(90deg,#1a1020,#14101a);
      border-bottom:1px solid var(--bd);font-size:14px;font-weight:800;color:var(--tx)}
    .nq-head::before{content:"";width:8px;height:8px;border-radius:50%;
      background:var(--grad);flex:0 0 auto}
    .nq-body{padding:14px}
    .nq-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
    .nq-row.single{grid-template-columns:1fr}
    .nq-field{display:flex;flex-direction:column;gap:4px}
    .nq-field label{font-size:11px;font-weight:800;color:#64748b;
      text-transform:uppercase;letter-spacing:.05em}
    .nq-field input,
    .nq-field select{font:inherit;font-size:14px;font-weight:600;
      padding:9px 11px;border:1px solid var(--bd);border-radius:10px;
      background:#1a1a1a;color:var(--tx);outline:none;
      transition:border-color .15s, box-shadow .15s}
    .nq-field input:focus,
    .nq-field select:focus{border-color:var(--blue); box-shadow:0 0 0 3px rgba(38,50,240,.15)}
    .nq-actions{margin-top:6px;display:flex;gap:10px}
    .nq-actions button{flex:1;border:0;font:inherit;font-weight:800;font-size:14px;
      padding:12px;border-radius:12px;cursor:pointer;
      transition:opacity .15s, transform .1s}
    .nq-actions button:active{transform:translateY(1px)}
    .btn-nq-add{background:var(--grad);color:#fff; box-shadow:0 3px 10px rgba(122,41,230,.25)}

(function setupTheme(){
  const btn = document.getElementById('btnTheme');
  const saved = localStorage.getItem('sinercomTheme') || 'dark';
  function setTheme(theme){
    const dark = theme === 'dark';
    document.body.classList.toggle('dark-theme', dark);
    document.body.classList.toggle('light-theme', !dark);
    btn.setAttribute('aria-pressed', String(dark));
    btn.textContent = dark ? '☀️ Tema claro' : '🌙 Tema oscuro';

  }
  setTheme(saved);
  btn.addEventListener('click', function(){
    setTheme(document.body.classList.contains('dark-theme') ? 'light' : 'dark');
  });
})();

(function setupPWA(){
  function makeIcon(size){
    const c = document.createElement('canvas');
    c.width = c.height = size;
    const ctx = c.getContext('2d');
    const s = size / 100;
    ctx.fillStyle = '#0a0a0a'; ctx.fillRect(0, 0, size, size);
    const grad = ctx.createLinearGradient(0, 0, size, size);
    grad.addColorStop(0,'#DD2FB5'); grad.addColorStop(0.55,'#7A29E6'); grad.addColorStop(1,'#2632F0');
    ctx.beginPath(); ctx.arc(50*s, 50*s, 42*s, 0, Math.PI*2);
    ctx.lineWidth = 8*s; ctx.strokeStyle = grad; ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(38*s, 53*s); ctx.quadraticCurveTo(34*s, 41*s, 47*s, 33*s);
    ctx.lineTo(68*s, 25*s); ctx.quadraticCurveTo(71*s, 27*s, 67*s, 33*s);
    ctx.lineTo(47*s, 52*s); ctx.quadraticCurveTo(42*s, 56*s, 38*s, 53*s);
    ctx.closePath(); ctx.fillStyle = grad; ctx.fill();
    ctx.beginPath();
    ctx.moveTo(62*s, 47*s); ctx.quadraticCurveTo(66*s, 59*s, 53*s, 67*s);
    ctx.lineTo(32*s, 75*s); ctx.quadraticCurveTo(29*s, 73*s, 33*s, 67*s);
    ctx.lineTo(53*s, 48*s); ctx.quadraticCurveTo(58*s, 44*s, 62*s, 47*s);
    ctx.closePath(); ctx.fill();
    return c.toDataURL('image/png');
  }
  const icon192 = makeIcon(192); const icon512 = makeIcon(512);
  const startUrl = location.origin + location.pathname;
  const manifest = { name:'Turnos del Personal', short_name:'Turnos',
    description:'Calendario unificado de turnos por unidad de negocio',
    start_url:startUrl,
    scope: location.pathname.substring(0, location.pathname.lastIndexOf('/') + 1) || '/',
    display:'standalone', orientation:'portrait',
    background_color:'#0a0a0a', theme_color:'#0a0a0a', lang:'es',
    icons:[
      { src: icon192, sizes:'192x192', type:'image/png', purpose:'any' },
      { src: icon512, sizes:'512x512', type:'image/png', purpose:'any' },
      { src: icon512, sizes:'512x512', type:'image/png', purpose:'maskable' }
    ]
  };
  const manifestData = 'data:application/manifest+json;charset=utf-8,' + encodeURIComponent(JSON.stringify(manifest));
  document.getElementById('manifestLink').href = manifestData;
  document.getElementById('appleIcon').href = icon192;
  const isHTTPS = location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1';
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
  const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
  const bar = document.getElementById('installBar');
  const barText = bar.querySelector('.install-text');
  const btnInstall = document.getElementById('btnInstall');
  const btnClose = document.getElementById('btnInstallClose');
  if (!isHTTPS || isStandalone) return;
  let dismissed = 0;
  try { dismissed = parseInt(localStorage.getItem('installBarDismissed') || '0', 10); } catch(_){ }
  const dismissActive = dismissed && (Date.now() - dismissed) < 7*24*60*60*1000;
  let deferredPrompt = null, bipFired = false;
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault(); deferredPrompt = e; bipFired = true;
    if (!dismissActive){
      barText.textContent = 'Instalá esta app en tu celular';
      btnInstall.textContent = 'Instalar'; bar.hidden = false;
    }
  });
  setTimeout(() => {
    if (!bipFired && !dismissActive){
      barText.textContent = isIOS ? 'Agregala a la pantalla de inicio desde Safari' : 'Instalá la app desde el menú de Chrome';
      btnInstall.textContent = 'Cómo'; bar.hidden = false;
    }
  }, 4000);
  btnInstall.addEventListener('click', async () => {
    if (deferredPrompt){ deferredPrompt.prompt();
      try { await deferredPrompt.userChoice; } catch(_){ }
      deferredPrompt = null; bar.hidden = true; return; }
    alert(isIOS ? 'iPhone/iPad:\n1. Compartir (⬆️).\n2. Añadir a pantalla de inicio.'
                : 'Android:\n1. Menú Chrome (⋮).\n2. "Instalar aplicación".');
  });
  btnClose.addEventListener('click', () => {
    bar.hidden = true;
    try { localStorage.setItem('installBarDismissed', String(Date.now())); } catch(_){ }
  });
  window.addEventListener('appinstalled', () => {
    bar.hidden = true;
    try { localStorage.removeItem('installBarDismissed'); } catch(_){ }
  });
})();

const PARTICLES = new Set(['de','del','la','las','los','y','e','da','das','do','dos','van','von']);

function toTitleCase(str){
  if (!str) return '';
  const words = str.toString().trim().toLowerCase().split(/\s+/);
  return words.map((w, i) => {
    if (!w) return '';
    if (i > 0 && PARTICLES.has(w)) return w;
    return w.charAt(0).toUpperCase() + w.slice(1);
  }).join(' ');
}

    case 'LH': if (idx<=31){const p=idx%5; return (p===2||p===3)?'':'LH';} return ((idx-35)%5>=3)?'':'LR';
    case 'NE': if (idx<=32) return (idx>=5 && idx%5===0)?'':'NE'; return ((idx-36)%5===0)?'':'SR';
    case 'VM': if (idx<=32) return (idx>=5 && idx%5===0)?'':'VM'; return ((idx-35)%5===0)?'':'LH';
    case 'DB': if (idx<=32) return (idx>=5 && idx%5===0)?'':'DB'; return ((idx-34)%5===0)?'':'LB';
    case 'SR': if (idx<=31) return (idx%5===2)?'':'SR';   return ((idx-38)%5===0)?'':'NE';
    case 'OK': return (idx>=5 && idx%5===0)?'':'OK';
    case 'AV': if (idx<=32) return (idx>=5 && idx%5===0)?'':'AV'; return ((idx-35)%5===0)?'':'VM';
    default: return '';
  }
}

function buildResumen(dia, unidad){
  const main = document.getElementById('vista');
  if (!main) return;
  main.innerHTML = '';
  const arr = [];
  for (const turno of SPOT_TURNOS) {
    const name = turno.puesto;
    const idx = SPOT_FECHAS.indexOf(dia);
    if (idx < 0) continue;
    const val = turno.valores[idx] || '';
    if (!val) continue;
    arr.push({ nombre: fixName(val), turno: turno.horario, puesto: name });
  }
  if (!arr.length) {
    main.innerHTML = '<div class="vacio">No hay información para este día.</div>';
    return;
  }

  const box = document.createElement('div');
  box.className = 'unidad-bloque';
  const header = document.createElement('div');
  header.className = 'unidad-head';
  header.style.setProperty('--uc', unidad.color);
  header.innerHTML = `<div class="unidad-name">${unidad.nombre}</div><div class="unidad-count">${arr.length}</div>`;
  box.appendChild(header);

  const group = document.createElement('div');
  for (const item of arr) {
    const row = document.createElement('div');
    row.className = 'turno';
    row.style.setProperty('--c', unidad.color);
    row.innerHTML = `
      <div class="avatar" style="background:${unidad.color};">${item.nombre.split(' ').map(x => x[0]).slice(0,2).join('').toUpperCase()}</div>
      <div class="cuerpo">
        <div class="fila1">
          <span class="nombre">${item.nombre}</span>
          <span class="badge">${item.puesto}</span>
        </div>
        <div class="fila2"><span class="hora">${item.turno}</span></div>
      </div>
    `;
    group.appendChild(row);
  }
  box.appendChild(group);
  main.appendChild(box);
}

function normalizeNombre(v){
  const s = (v || '').toString().trim();
  if (!s) return '';
  return fixName(s.replace(/\s+/g,' '));
}

function paintNombre(name){
  const nn = normalizeNombre(name);
  if (!nn) return '';
  const short = nn.split(' ').map(p => p[0] || '').join('').slice(0,2).toUpperCase();
  return short;
}

function getFechaActual(){
  const d = new Date();
  const y = d.getFullYear();
  const m = (d.getMonth() + 1).toString().padStart(2,'0');
  const dd = d.getDate().toString().padStart(2,'0');
  return `${dd}/${m}/${y}`;
}

})();
