<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Turnos SINERCOM</title>
  <style>
    :root {
      --bg: #0a0a0a;
      --panel: #141414;
      --border: #262626;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --grad: linear-gradient(135deg, #DD2FB5 0%, #7A29E6 50%, #2632F0 100%);
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      background: rgba(10,10,10,0.96);
      border-bottom: 1px solid var(--border);
      padding: 14px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .logo {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      background: var(--grad);
      box-shadow: 0 8px 20px rgba(122, 41, 230, 0.35);
      font-size: 1.2rem;
    }

    .title {
      font-size: 1rem;
      color: var(--text);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 7px 12px;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 800;
      color: white;
      background: var(--grad);
      border: 1px solid rgba(255,255,255,0.12);
    }

    .frame-wrap {
      flex: 1;
      width: 100%;
      min-height: 0;
      background: var(--panel);
      border-top: 1px solid var(--border);
    }

    iframe {
      display: block;
      width: 100%;
      height: 100%;
      min-height: calc(100vh - 72px);
      border: 0;
      background: white;
    }

    @media (max-width: 640px) {
      .topbar {
        padding: 12px 14px;
      }
      .title {
        font-size: 0.9rem;
      }
      .badge {
        font-size: 0.68rem;
      }
    }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="brand">
      <div class="logo">S</div>
      <div class="title">Turnos del Personal</div>
    </div>
    <div class="badge">Excel Online</div>
  </div>

  <div class="frame-wrap">
    <iframe
      src="https://sinercomsantafe-my.sharepoint.com/:x:/r/personal/juan_ramayo_sinercom_ar/_layouts/15/Doc.aspx?sourcedoc=%7BD206D1F8-DD1F-4CCD-AFD4-00333F6C3473%7D&file=Horarios%20%20agosto%2Cseptiembre%2Caoctubre.xlsx&action=default&mobileredirect=true&wdwpf=c&embed=true"
      title="Planilla de horarios de SINERCOM"
      allowfullscreen>
    </iframe>
  </div>
</body>
</html>
